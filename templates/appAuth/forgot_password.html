{% extends "base.html" %}

{% block content %}
<h1>Forgot Password</h1>
<form method="post">
    {% csrf_token %}
    <div class="form-group mb-3">
        <input type="email" name="email" placeholder="Enter your email" required>
    </div>
    <div class="form-group mb-3">
        <button type="submit">Reset Password</button>
    </div>
    {% endblock %}
