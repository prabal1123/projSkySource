{% extends "base.html" %}
{% load static %}

{% block title %}Password Updated{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="sky-auth-wrap">
    <div class="sky-auth-card" style="text-align:center;">
        <span class="sky-auth-eyebrow">Account / Security</span>
        <h1>Password Updated</h1>
        <p style="color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 1.5rem;">
            Your password has been changed successfully.
        </p>
        <a href="{% url 'dashboard' %}" class="sky-auth-submit" style="display:block; text-decoration:none; box-sizing:border-box;">
            Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
