{% extends "base.html" %}
{% load static %}

{% block title %}Password Updated{% endblock %}

{% block extra_css %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/numahr-tokens.css' %}">
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="sky-auth-wrap">
    <div class="sky-auth-card sky-auth-center">
        <span class="sky-auth-eyebrow">Account / Security</span>
        <h1>Password Updated</h1>
        <p class="sky-auth-message">
            Your password has been changed successfully.
        </p>
        <a href="{% url 'dashboard' %}" class="sky-auth-submit sky-auth-link-btn">
            Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
